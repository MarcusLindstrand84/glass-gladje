    <path d="M32 28c3 2 7 3 12 2.5 4-.4 8-2 11-4" stroke="#fff8f0" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
    <path d="M31 34c4 2.5 9 3.5 14 2.5 3.5-.7 7-2.5 9.5-4.5" stroke="#c47a5e" stroke-width="1.3" stroke-linecap="round" opacity="0.35"/>
    <ellipse cx="36" cy="24" rx="5.5" ry="4" fill="url(#scoopShine)"/>
