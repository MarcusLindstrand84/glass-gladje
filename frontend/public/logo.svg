  <text x="96" y="48" fill="#1c1917" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="500" letter-spacing="-0.03em">Glassglädje</text>
  <text x="96" y="72" fill="#8f7350" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="0.04em">Glädje du kan smaka</text>
