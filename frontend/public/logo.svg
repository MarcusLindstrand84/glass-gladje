<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Glassglädje</title>
  <desc id="logoDesc">Glädje du kan smaka</desc>
  <defs>
    <linearGradient id="scoopBody" x1="28" y1="14" x2="58" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3c4b0"/>
      <stop offset="0.45" stop-color="#e8a58a"/>
      <stop offset="1" stop-color="#d4896e"/>
    </linearGradient>
    <linearGradient id="scoopCream" x1="30" y1="36" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8f0"/>
      <stop offset="1" stop-color="#f0d4b4"/>
    </linearGradient>
    <linearGradient id="spoonMetal" x1="12" y1="20" x2="70" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8d5a8"/>
      <stop offset="0.5" stop-color="#c4a574"/>
      <stop offset="1" stop-color="#a68b52"/>
    </linearGradient>
    <radialGradient id="scoopShine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(36 22) rotate(90) scale(14 16)">
      <stop stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(4, 10) scale(1)">
    <circle cx="40" cy="40" r="37" fill="#f5efe6"/>
    <circle cx="40" cy="40" r="37" stroke="#c4a574" stroke-width="1.2" opacity="0.55"/>
    <path d="M18 52c8-6 16-14 22-22" stroke="url(#spoonMetal)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M16 54.5c1.2 1.8 3.2 2.6 5.2 1.6" stroke="url(#spoonMetal)" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="44" cy="42" rx="16" ry="9" transform="rotate(-28 44 42)" fill="url(#spoonMetal)"/>
    <ellipse cx="44" cy="41" rx="12" ry="6" transform="rotate(-28 44 41)" fill="#f7ecd4" opacity="0.55"/>
    <path d="M34 44c2 4 6 7 12 6 4-.5 7-2 9-4-1 5-4 9-10 10-7 1-12-3-13-8 .5-1.5 1.2-3 2-4Z" fill="url(#scoopCream)"/>
    <path d="M50 48c.5 3 .2 6-1.2 8.5" stroke="#e8a58a" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="48.5" cy="57.5" r="1.6" fill="#e8a58a" opacity="0.9"/>
